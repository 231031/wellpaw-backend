services:
  wellpaw_backend:
    container_name: wellpaw-api
    build: 
      context: .
      dockerfile: Dockerfile.prod
    env_file:
      - .env.prod
    restart: unless-stopped
    ports:
      - "50001:50001"
    depends_on:
      wellpaw_db:
        condition: service_healthy
    networks:
      - wellpaw-shared-nw

  wellpaw_db:
    image: postgres:17-alpine
    restart: unless-stopped
    container_name: wellpaw-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - wellpaw_db_volumes:/var/lib/postgresql/data
    networks:
      - wellpaw-nw
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
  
  wellpaw_redis:
    image: redis:7.2-alpine
    container_name: wellpaw-redis
    env_file:
      - .env
    ports:
      - "6379:6379"
    volumes:
      - wellpaw_cache:/data
      - ./secrets/redis_cert.pem:/tls/cert.pem
      - ./secrets/redis_key.pem:/tls/key.pem
    restart: unless-stopped
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD}
      --tls-port 6379
      --port 0
      --tls-cert-file /tls/cert.pem
      --tls-key-file /tls/key.pem
      --tls-auth-clients no
    healthcheck:
      test: ["CMD", "redis-cli", "--tls", "--insecure", "-a", "${REDIS_PASSWORD}", "ping"]
    networks:
      - wellpaw-nw

networks:
  wellpaw-nw:
    driver: bridge
volumes:
  wellpaw_db_volumes:
  wellpaw_cache: