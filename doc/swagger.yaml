host: localhost:50001
info:
  contact:
    email: fiber@swagger.io
    name: API Support
  description: WellPaw API is a RESTful API for managing and tracking pet health
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: WellPaw API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: login a user
      parameters:
      - description: Login payload
        in: body
        name: LoginPayload
        required: true
        schema:
          $ref: '#/definitions/github_com_231031_wellpaw-backend_internal_model.LoginPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_231031_wellpaw-backend_internal_model.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_231031_wellpaw-backend_internal_model.HTTPResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_231031_wellpaw-backend_internal_model.HTTPResponse'
      summary: Login User
      tags:
      - Authentication
  /auth/login/google:
    post:
      consumes:
      - application/json
      description: login a user with google
      parameters:
      - description: Login google payload
        in: body
        name: LoginGooglePayload
        required: true
        schema:
          $ref: '#/definitions/github_com_231031_wellpaw-backend_internal_model.LoginGooglePayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_231031_wellpaw-backend_internal_model.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_231031_wellpaw-backend_internal_model.HTTPResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_231031_wellpaw-backend_internal_model.HTTPResponse'
      summary: Login User With Google
      tags:
      - Authentication
  /auth/otp:
    post:
      consumes:
      - application/json
      description: request otp for password reset
      parameters:
      - description: Request OTP payload
        in: body
        name: RequestOTPPayload
        required: true
        schema:
          $ref: '#/definitions/github_com_231031_wellpaw-backend_internal_model.RequestOTPPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_231031_wellpaw-backend_internal_model.HTTPResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_231031_wellpaw-backend_internal_model.HTTPResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_231031_wellpaw-backend_internal_model.HTTPResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_231031_wellpaw-backend_internal_model.HTTPResponse'
      summary: Request OTP
      tags:
      - Authentication
  /auth/register:
    post:
      consumes:
      - application/json
      description: register a new user
      parameters:
      - description: Register payload
        in: body
        name: RegisterPayload
        required: true
        schema:
          $ref: '#/definitions/github_com_231031_wellpaw-backend_internal_model.User'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_231031_wellpaw-backend_internal_model.User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_231031_wellpaw-backend_internal_model.HTTPResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_231031_wellpaw-backend_internal_model.HTTPResponse'
      summary: Register User
      tags:
      - Authentication
  /auth/resetpassword:
    post:
      consumes:
      - application/json
      description: reset password with email and otp
      parameters:
      - description: Reset password payload
        in: body
        name: ResetPasswordPayload
        required: true
        schema:
          $ref: '#/definitions/github_com_231031_wellpaw-backend_internal_model.ResetPasswordPayload'
